name: deploy-on-push

# Muse 托管模式（切换后启用，本文件现为草案，勿直接提交）：
# 数据由 Muse 侧每小时管线在本地生成（reader → adapter → movers →
# 质量门），过门后经 GitHub API 把 dist/data/ 四个文件一次性提交
# 到 main；本工作流只负责把仓库当前 dist/ 部署到 Cloudflare Pages。
#
# 与旧 hourly-update.yml 的差异见 hosting/WORKFLOW-DIFF.md。
# 启用方式：切换时以本文件内容覆盖 .github/workflows/hourly-update.yml
# （同名替换，避免仓库里同时存在两个部署工作流）。

on:
  push:
    paths:
      - "dist/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-on-push
  cancel-in-progress: false

# 只读检出即可：存档推送与数据提交都走 Muse 侧的 API 令牌，
# Actions 不再往仓库写任何东西。
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages (Direct Upload)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=aerodash --branch=main
